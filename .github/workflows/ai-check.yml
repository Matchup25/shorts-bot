name: AI check

# Quick test of the three AI services the bot can use (no video is made).
on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml google-genai
      - name: Ask GitHub Models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_MODELS_TOKEN: ${{ github.token }}
          LLM_FORCE: github
        run: |
          python - <<'PY'
          from bot.brain import Brain
          from bot.util import load_config
          b = Brain(load_config())
          print("ANSWER:", b.ask('Return JSON {"ok": true, "capital_of_france": "..."}', 0.2))
          PY
