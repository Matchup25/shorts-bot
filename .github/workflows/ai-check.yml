name: AI check

# Quick test of the three AI services the bot can use (no video is made).
on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml google-genai
      - name: Raw call to GitHub Models (as in GitHub's documentation)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sS -i "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{"messages":[{"role":"user","content":"Say hi"}],"model":"openai/gpt-4o-mini"}' | head -c 1500
          echo; echo ---
          curl -sS -i -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{"messages":[{"role":"user","content":"Say hi"}],"model":"openai/gpt-4.1"}' | head -c 1500
      - name: Ask GitHub Models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_MODELS_TOKEN: ${{ github.token }}
          LLM_FORCE: github
        run: |
          python - <<'PY'
          from bot.brain import Brain
          from bot.util import load_config
          b = Brain(load_config())
          print("ANSWER:", b.ask('Return JSON {"ok": true, "capital_of_france": "..."}', 0.2))
          PY
