name: Daily Short

on:
  schedule:
    # 03:47 and 15:47 UTC = 04:47 / 16:47 in Zurich (winter), 05:47 / 17:47 (summer).
    # Each run prepares one Short and YouTube publishes it at 07:00 / 19:00 Zurich time.
    - cron: "47 3 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode: make the video but do NOT upload it"
        type: boolean
        default: false
      privacy:
        description: "Upload as (empty = use config.yaml)"
        type: choice
        options: ["", "private", "unlisted", "public"]
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install animation engine
        run: npm ci --prefix video --no-audit --no-fund

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji libcairo2 > /dev/null

      - name: Restore voice model
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model (first run only)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Make and publish the Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome
          DRY_RUN: ${{ inputs.test_mode }}
          PRIVACY_OVERRIDE: ${{ inputs.privacy }}
        run: python -m bot.main

      - name: Keep the video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the test video on the test-output branch
        if: success() && inputs.test_mode == true
        run: |
          mkdir /tmp/out && cp output/*.mp4 /tmp/out/ && cp video/public/run/props.json /tmp/out/
          cd /tmp/out
          git init -q -b test-output
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add . && git commit -q -m "Test render ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" test-output

      - name: Remember published stories
        if: success() && inputs.test_mode != true
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "Published a new Short" || echo "Nothing new to save"
          git push
