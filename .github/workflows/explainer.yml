name: Explainer Short

# Second channel ("how the world really works"). Started by every wake-up of the Daily Short workflow
# (and by this timer as a backup); it makes a Short only when one of explainer.publish_times is due.
# Nothing happens until the YT2_REFRESH_TOKEN secret exists (except test runs).
on:
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test: make the video but do not upload (saved on the explainer-test-output branch)"
        type: boolean
        default: true
      topic:
        description: "Optional: topic to use (e.g. How a brick wall is built)"
        default: ""
      auto:
        description: "Behave like a scheduled run"
        type: boolean
        default: false
      privacy:
        description: "Upload as (empty = config)"
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Is an explainer Short due?
        id: due
        env:
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.test_mode }}
          PRIVACY_OVERRIDE: ${{ inputs.privacy }}
          BOT_TRIGGER: ${{ inputs.auto }}
        run: pip install -q pyyaml && python -m bot.explainer --check

  make:
    needs: check
    if: needs.check.outputs.due == 'true'
    # one Short at a time (test runs have their own lane). Only this job is serialised, so a run that is
    # waiting to post on Instagram never blocks the next wake-up.
    concurrency:
      group: explainer-${{ inputs.test_mode == true && 'test' || 'live' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      published: ${{ steps.make.outputs.published }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install animation engine
        run: npm ci --prefix video --no-audit --no-fund

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji libcairo2 > /dev/null

      - name: Restore voice model
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model (first run only)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Make and publish the explainer Short
        id: make
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome
          DRY_RUN: ${{ inputs.test_mode }}
          PRIVACY_OVERRIDE: ${{ inputs.privacy }}
          BOT_TRIGGER: ${{ inputs.auto }}
          FORCE_TOPIC: ${{ inputs.topic }}
        run: |
          python -m bot.explainer
          if [ -f output/golive.json ]; then echo "published=true" >> "$GITHUB_OUTPUT"; fi

      - name: Keep the video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explainer
          path: |
            output/*.mp4
            output/golive.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the test video on the test-output branch
        if: success() && inputs.test_mode == true
        run: |
          mkdir /tmp/out && cp output/*.mp4 /tmp/out/ && cp video/public/run/props.json /tmp/out/
          cd /tmp/out
          git init -q -b explainer-test-output
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add . && git commit -q -m "Test render ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:explainer-test-output

      - name: Remember published topics
        if: success() && inputs.test_mode != true
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          [ -f data/explainer_history.json ] && git add data/explainer_history.json
          git commit -q -m "Published an explainer Short" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done


  golive:
    needs: make
    if: needs.make.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 380
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml google-api-python-client google-auth
      - uses: actions/download-artifact@v4
        with:
          name: explainer
          path: output
      - name: Wait until the Short goes live, then ask the viewers a question
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
        run: |
          python -m bot.golive wait --meta output/golive.json
          python -m bot.golive comment --meta output/golive.json
