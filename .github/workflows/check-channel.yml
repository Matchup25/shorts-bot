name: Check channel

# Shows which YouTube channel (and Instagram account) the bot publishes to and whether the AI pictures work (no changes are made).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth pyyaml requests pillow
      - name: Do AI pictures work?
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python - <<'PY'
          from bot import media
          ok = media.ai_image("a glowing globe floating in space", "/tmp/test.jpg")
          print("AI PICTURES:", "OK" if ok else "NOT WORKING")
          PY
      - name: Instagram?
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: pip install -q cryptography && python -m bot.instagram check || true
      - name: Second channel (RerumFabrica)?
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from bot import youtube
          if not os.environ.get("YT2_REFRESH_TOKEN"):
              print("RERUMFABRICA: not connected yet (secret YT2_REFRESH_TOKEN missing)")
              raise SystemExit
          names = {"youtube.upload": "upload", "youtube.readonly": "read", "youtube.force-ssl": "comments",
                   "yt-analytics.readonly": "analytics"}
          got = [names.get(x.rsplit("/", 1)[-1], x) for x in youtube.granted_scopes("YT2_REFRESH_TOKEN")]
          print("RERUMFABRICA PERMISSIONS:", ", ".join(got) or "(token not working)")
          for ch in youtube.service("YT2_REFRESH_TOKEN").channels().list(part="snippet", mine=True).execute().get("items", []):
              print("RERUMFABRICA CHANNEL:", ch["snippet"]["title"], ch["snippet"].get("customUrl", ""), ch["id"])
          PY
      - name: Which channel?
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from bot import youtube
          names = {"youtube.upload": "upload", "youtube.readonly": "read", "youtube.force-ssl": "comments",
                   "yt-analytics.readonly": "analytics"}
          got = [names.get(x.rsplit("/", 1)[-1], x) for x in youtube.granted_scopes()]
          print("YOUTUBE PERMISSIONS:", ", ".join(got) or "(token not working)")
          yt = youtube.service()
          for ch in yt.channels().list(part="snippet", mine=True).execute().get("items", []):
              print("CHANNEL:", ch["snippet"]["title"], ch["snippet"].get("customUrl", ""), ch["id"])
          history = json.load(open("data/history.json"))
          ids = ",".join(h["video_id"] for h in history[-5:] if h.get("video_id"))
          if ids:
              for v in yt.videos().list(part="snippet,status", id=ids).execute().get("items", []):
                  print("VIDEO:", v["id"], "|", v["snippet"]["channelTitle"], "|", v["status"]["privacyStatus"], "|", v["snippet"]["title"])
          PY
