name: Instagram - publish an existing Short

# Puts a Short that is already on YouTube on Instagram as a Reel.
# Needs the YouTube video ID and the number of the "Daily Short" run that made it (its video is kept 7 days).
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID (e.g. TSxuU_H9WgU)"
        required: true
      run_id:
        description: "Number of the Daily Short run that made the video"
        required: true
      when:
        description: "Publish at (UTC, e.g. 2026-11-23T06:00:00Z); empty = now; at most ~5 hours ahead"
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: instagram-repost
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography pyyaml google-api-python-client google-auth
      - name: Get the video
        run: gh run download "${{ inputs.run_id }}" -n shorts -D output -R "$GITHUB_REPOSITORY" && ls -la output
      - name: Caption from the YouTube video
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          WHEN: ${{ inputs.when }}
        run: python -m bot.repost
      - name: Put the video online for Instagram (ig-media branch)
        id: host
        run: |
          VIDEO=$(python -c "import json;print(json.load(open('output/ig.json'))['video'])")
          NAME="reel_$(date -u +%Y%m%d_%H%M%S).mp4"
          mkdir -p /tmp/ig && cp "output/$VIDEO" "/tmp/ig/$NAME"
          cd /tmp/ig && git init -q -b ig-media && git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add . && git commit -q -m "Reel $NAME"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ig-media
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ig-media/$NAME" >> "$GITHUB_OUTPUT"
      - name: Publish the Reel
        run: python -m bot.instagram post --meta output/ig.json --url "${{ steps.host.outputs.url }}"
      - name: Remember the Reel
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          for f in data/ig_history.json data/ig_token.enc; do [ -f "$f" ] && git add "$f"; done
          git commit -q -m "Published a Reel" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
