name: Demo video

# Renders samples/sample_story.json (no Gemini, no upload) and saves the video
# on the branch "demo-output" and as a downloadable artifact.
on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          npm ci --prefix video --no-audit --no-fund
          pip install -q -r requirements.txt

      - name: Restore voice model
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model (first run only)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Render the sample Short
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome
        run: python scripts/render_sample.py samples/sample_story.json

      - uses: actions/upload-artifact@v4
        with:
          name: demo-short
          path: output/sample_short.mp4

      - name: Save the video on the demo-output branch
        run: |
          mkdir /tmp/out && cp output/sample_short.mp4 /tmp/out/ && cp video/public/run/props.json /tmp/out/
          cd /tmp/out
          git init -q -b demo-output
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add . && git commit -q -m "Demo render ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" demo-output
