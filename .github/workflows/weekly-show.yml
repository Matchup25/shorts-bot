name: Weekly show

# Every Sunday: the most important stories of the week (~15 min), published at 19:00 Zurich time.
# The video is rendered in 6 parallel parts so it is ready in about an hour.
on:
  schedule:
    - cron: "7 11 * * 0"   # Sunday 12:07 Zurich (winter) / 13:07 (summer)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode: make the show but do NOT upload it"
        type: boolean
        default: true
      stories:
        description: "Number of stories"
        default: "15"

permissions:
  contents: write

concurrency:
  group: weekly-show
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      frames: ${{ steps.prep.outputs.frames }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          npm ci --prefix video --no-audit --no-fund
      - name: Restore voice model
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Download voice model (first run only)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Write the show
        id: prep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m bot.weekly prepare --count "${{ inputs.stories || '15' }}" ${{ inputs.test_mode == true && '--test' || '' }}
      - name: Thumbnail
        working-directory: video
        run: npx remotion still src/index.ts WeeklyThumb public/run/thumb.jpg --props=public/run/thumb-props.json --browser-executable=/usr/bin/google-chrome --log=warn || true
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-run
          path: video/public/run
          retention-days: 3

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci --prefix video --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: weekly-run
          path: video/public/run
      - name: Render part ${{ matrix.part }}
        working-directory: video
        run: |
          TOTAL=${{ needs.prepare.outputs.frames }}
          SIZE=$(( (TOTAL + 5) / 6 ))
          START=$(( ${{ matrix.part }} * SIZE ))
          END=$(( START + SIZE - 1 )); [ $END -ge $TOTAL ] && END=$(( TOTAL - 1 ))
          echo "frames $START-$END of $TOTAL"
          npx remotion render src/index.ts WeeklyShow out/part${{ matrix.part }}.mp4 \
            --props=public/run/weekly-props.json --frames=$START-$END --muted --crf=20 \
            --concurrency=$(nproc) --browser-executable=/usr/bin/google-chrome --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: video/out/part${{ matrix.part }}.mp4
          retention-days: 3

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q google-api-python-client google-auth pyyaml requests numpy soundfile feedparser
      - uses: actions/download-artifact@v4
        with:
          name: weekly-run
          path: video/public/run
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Join the parts and add the sound
        run: |
          for i in 0 1 2 3 4 5; do echo "file '$PWD/parts/part$i.mp4'"; done > parts.txt
          ffmpeg -v error -y -f concat -safe 0 -i parts.txt -i video/public/run/mix.wav \
            -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart weekly.mp4
          ls -la weekly.mp4
      - name: Publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m bot.weekly publish --video weekly.mp4 ${{ inputs.test_mode == true && '--test' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-show
          path: weekly.mp4
          retention-days: 7
      - name: Test preview on the weekly-output branch
        if: inputs.test_mode == true
        run: |
          mkdir /tmp/out
          ffmpeg -v error -y -i weekly.mp4 -vf scale=854:480 -c:v libx264 -preset veryfast -crf 31 -c:a aac -b:a 64k /tmp/out/weekly_preview.mp4
          for t in 2 60 200 400 600; do ffmpeg -v error -y -ss $t -i weekly.mp4 -frames:v 1 /tmp/out/frame_$t.jpg || true; done
          cp video/public/run/weekly-props.json video/public/run/weekly-meta.json /tmp/out/
          cp video/public/run/thumb.jpg /tmp/out/ 2>/dev/null || true
          ls -la /tmp/out
          cd /tmp/out && git init -q -b weekly-output && git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add . && git commit -q -m "Weekly test ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" weekly-output
      - name: Remember the episode
        if: inputs.test_mode != true
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/weekly_history.json
          git commit -q -m "Published the weekly show" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
