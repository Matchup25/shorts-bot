# ------------------------------------------------------------
#  SHORTS BOT – settings
#  You can change the values after the colon. Keep the spacing.
# ------------------------------------------------------------

# Name shown at the top of every video
channel_name: "WORLD IN A SHOT"
youtube_handle: "@shottheworld"

# Who can see the uploaded video:
#   private  = only you (use this while testing)
#   unlisted = anyone with the link
#   public   = everyone (use this when you are happy with the results)
privacy: public

# When public videos go live (local time). The bot prepares each video
# about two hours earlier and YouTube publishes it at the exact time.
timezone: Europe/Zurich
publish_times:
  - "07:00"
  - "13:00"
  - "19:00"

# Instagram stories ("LAST MINUTE" / "DID YOU KNOW?", alternating), Zurich time
story_times: ["06:47", "09:47", "12:47", "15:47", "18:47", "21:47"]  # = the wake-ups of the cron-job.org timer

# Weekly show (every Sunday): number of stories and time it goes live
weekly_stories: 15
weekly_publish_time: "19:00"

# How many Shorts to make each time the bot runs (1 is recommended)
videos_per_run: 1

# Narrator voice (free Kokoro voices). Good English options:
#   af_heart (female, US)  am_michael (male, US)  bf_emma (female, UK)  bm_george (male, UK)
voice: af_heart
voice_speed: 1.08

# Tell YouTube that the video contains AI-generated sound/visuals (recommended: true)
ai_disclosure: true

# Only use news published in the last X hours
max_story_age_hours: 36

# Gemini models to try, in order (the bot falls back automatically)
gemini_models:
  - gemini-3.5-flash
  - gemini-flash-latest
  - gemini-3.5-flash-lite

# Topics the bot must avoid (keeps videos advertiser-friendly)
avoid_topics:
  - deaths, killings, shootings, terrorism, war casualties
  - crime and court cases about private individuals
  - sexual content
  - elections and partisan politics
  - medical advice
  - suicide or self-harm

# News sources (RSS feeds). Broken or outdated feeds are skipped automatically.
feeds:
  BBC News:
    - https://feeds.bbci.co.uk/news/world/rss.xml
    - https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    - https://feeds.bbci.co.uk/news/technology/rss.xml
  Sky News:
    - https://feeds.skynews.com/feeds/rss/world.xml
    - https://feeds.skynews.com/feeds/rss/technology.xml
    - https://feeds.skynews.com/feeds/rss/strange.xml
  CNN:
    - http://rss.cnn.com/rss/edition_world.rss
    - http://rss.cnn.com/rss/edition_technology.rss
    - http://rss.cnn.com/rss/edition_space.rss
  The Guardian:
    - https://www.theguardian.com/science/rss
    - https://www.theguardian.com/technology/rss
    - https://www.theguardian.com/world/rss
  NPR:
    - https://feeds.npr.org/1001/rss.xml
    - https://feeds.npr.org/1019/rss.xml
  Al Jazeera:
    - https://www.aljazeera.com/xml/rss/all.xml
  CBS News:
    - https://www.cbsnews.com/latest/rss/science
    - https://www.cbsnews.com/latest/rss/technology

# Second channel: RerumFabrica, "how the world really works" explainers (English). Topics: topics.txt
explainer:
  channel_name: "RERUMFABRICA"        # shown in the videos
  channel_title: "RerumFabrica"       # the YouTube channel's name: the bot refuses to publish anywhere else
  accent: "#FF6A1A"                   # channel colour in the videos
  publish_times: ["17:00"]
  voice: bm_george
  voice_speed: 1.0
  categories: [homes and construction, electricity and energy, transport, the human body, food and farming,
               internet and technology, money and the economy, nature and weather, factories and materials, space]
